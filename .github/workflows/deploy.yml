name: Deploy to Server

on:
  push:
    branches:
      - 'krvvko.me-ruby'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get branch name
        id: branch_name
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: '22'
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/deploy/apps/krvvko.me

            git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
            git fetch --prune origin
            git checkout -B ${{ steps.branch_name.outputs.branch }} origin/${{ steps.branch_name.outputs.branch }}
            git reset --hard origin/${{ steps.branch_name.outputs.branch }}

            docker compose down || true
            nice -n 10 docker compose build --parallel
            docker compose up -d
