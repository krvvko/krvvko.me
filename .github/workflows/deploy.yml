name: Build and Deploy to Server

on:
  push:
    branches:
      - krvvko.me-tanzanite

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install

      - name: Create .env for client
        run: |
          cat <<EOF > .env
          REACT_APP_API_URL=https://api.krvvko.me/api
          EOF

      - name: Build the project
        run: |
          npm run build

      - name: Clean previous build on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            rm -rf /home/krvvko/krvvko.me/

      - name: Copy build directories and package.json via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          source: "build/*"
          target: "/home/krvvko/krvvko.me/"